# Build แอป iOS บน Mac คลาวด์ของ GitHub — เครื่อง MBP 2019 ที่ร้านลง Xcode ใหม่ไม่ได้ถาวร
# ตอนนี้ build แบบไม่เซ็น (ยังไม่มีบัญชี Apple Developer) เอาไว้พิสูจน์ว่าโครง ios/ ใช้ได้จริง
# ได้บัญชีเมื่อไหร่ค่อยเพิ่มขั้น signing + upload TestFlight ต่อท้าย
#
# ⚠️ กดรันเองเท่านั้น (workflow_dispatch) — เครื่อง macOS กินนาที Actions แพง 10 เท่า
#    ห้ามเปลี่ยนเป็นรันทุก push
name: iOS build (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native-app/package-lock.json

      - name: ติดตั้ง dependencies ของ Capacitor
        run: npm ci

      - name: cap sync ios (สร้าง capacitor.config.json + public)
        run: npx cap sync ios

      - name: pod install
        working-directory: native-app/ios/App
        run: pod install

      - name: xcodebuild (ไม่เซ็น)
        working-directory: native-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tail -40

      - name: เก็บผล build ไว้ดู (App.app)
        uses: actions/upload-artifact@v4
        with:
          name: GUCUT-ios-unsigned
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/*-iphoneos/App.app
          if-no-files-found: warn
