# ให้ Netlify build เองจาก GitHub — push โค้ดขึ้น repo แล้วเว็บอัปเดตอัตโนมัติ
[build]
  command = "npm run build"      # prebuild (gen-reviews.mjs) รันเองอัตโนมัติ
  publish = "out"

  # ⚠️ ข้ามการ build ถ้าแก้แต่ไฟล์เอกสาร — Netlify คิดเครดิตทุกครั้งที่ build (~15 หน่วย)
  #
  #    วัดจริง 23 ส.ค. 2569: 7 วันมี 103 commit และ 30 ครั้งเป็นการแก้ CLAUDE.md ล้วน ๆ
  #    = เสียไปเปล่า ๆ ราว 450 เครดิต/เดือน ทั้งที่หน้าเว็บไม่เปลี่ยนสักพิกเซล
  #
  #    วิธีอ่านคำสั่ง: exit 0 = "ข้าม build" · exit 1 = "build ต่อ"
  #    git diff --quiet คืน 0 เมื่อ "ไม่มีอะไรต่างกัน"
  #    จึงแปลว่า ถ้านอกเหนือจากไฟล์ที่ยกเว้นแล้วไม่มีอะไรเปลี่ยน → ข้าม build
  #
  #    ⚠️ ห้ามใส่ไฟล์ที่มีผลกับหน้าเว็บลงในรายการยกเว้นเด็ดขาด
  #       ใส่ผิดครั้งเดียว = แก้เว็บแล้วไม่ขึ้น และไม่มีอะไรฟ้องให้รู้
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)CLAUDE.md' ':(exclude)README.md' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# แคชไฟล์ที่ไม่มีวันเปลี่ยนเนื้อหา ให้เบราว์เซอร์เก็บไว้ยาว ๆ
#
# ⚠️ ค่าเริ่มต้นของ Netlify คือ max-age=0, must-revalidate
#    แปลว่าลูกค้าที่กลับมาเปิดเว็บซ้ำ ต้องถาม "รูปนี้เปลี่ยนไหม" ใหม่ทุกใบทุกครั้ง
#    วัดจริง 23 ส.ค. 2569: รูปสินค้า 5,596 ใบ รีวิว 3,117 ใบ ไม่มีใบไหนถูกแคชเลย
#    เสียทั้งความเร็ว (ต้องรอถาม-ตอบก่อนวาดรูป) และเสียทั้งเครดิต Netlify
#    (bandwidth + web requests รวมกันเป็น 30% ของบิลเดือนนี้)
#
# ⚠️ ทำแบบนี้ได้เพราะไฟล์พวกนี้ "ชื่อเดิม = เนื้อหาเดิมเสมอ"
#    รูปสินค้าและรูปรีวิวถูกดึงมาเก็บครั้งเดียวแล้วไม่เคยแก้ทับ
#    ถ้าวันหนึ่งจะเปลี่ยนรูปของสินค้าตัวเดิม ต้อง "ตั้งชื่อไฟล์ใหม่" เท่านั้น
#    แก้ทับชื่อเดิม = ลูกค้าที่เคยเข้าจะเห็นรูปเก่าไปอีกปีนึง
#
# ⚠️ ห้ามใส่ /*.html หรือหน้าเว็บลงในนี้เด็ดขาด
#    หน้าเว็บต้องขอใหม่ทุกครั้ง ไม่งั้น deploy แล้วลูกค้าไม่เห็นของใหม่
[[headers]]
  for = "/img/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/rv-img/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/art/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/rv-video/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# ตัวแสกนภาพ — ก้อนใหญ่ที่สุดในเว็บ (โมเดล 5.3MB + ลายนิ้วมือสินค้า 1.2MB)
# ⚠️ ไม่ใส่ immutable เพราะสร้างใหม่ทุกครั้งที่เพิ่มรูปสินค้า
#    ให้แคช 7 วันแล้วค่อยถามใหม่ กำลังพอดีระหว่าง "ไม่ต้องโหลดซ้ำ" กับ "ของใหม่ถึงมือ"
[[headers]]
  for = "/img-vectors.bin"
  [headers.values]
    cache-control = "public, max-age=604800"

[[headers]]
  for = "/model/*"
  [headers.values]
    cache-control = "public, max-age=604800"

# Image CDN — อนุญาตให้ย่อรูปจากโดเมนภายนอกเหล่านี้
# (รูปสินค้าจาก Shopify + รูปรีวิวจากแพลตฟอร์มต่าง ๆ)
[images]
  remote_images = [
    "https://cdn\\.shopify\\.com/.*",
    # รูปปกคลิปหลังย้ายไปเก็บที่ R2 ของเราเอง (ดู HOST ใน src/lib/videos.ts)
    # ช่วงแรกใช้ลิงก์ฟรีของ Cloudflare (pub-xxxx.r2.dev) ก่อน
    # วันที่ย้าย gucut.com มาอยู่ Cloudflare ค่อยเปลี่ยนไปใช้ video.gucut.com
    "https://pub-[a-z0-9]+\\.r2\\.dev/.*",
    "https://video\\.gucut\\.com/.*",
    "https://lzd-u\\.slatic\\.net/.*",
    "https://sg-test-11\\.slatic\\.net/.*",
    "https://cf\\.shopee\\.com/.*",
    "https://down-th\\.img\\.susercontent\\.com/.*",
    "https://p16-oec-sg\\.ibyteimg\\.com/.*",
    "https://p16-oec-va\\.ibyteimg\\.com/.*",
  ]

# ---------------------------------------------------------------------------
# 🚫 admin.gucut.com "ไม่ได้" ถูกเสิร์ฟจากโปรเจกต์นี้ — ห้ามเขียนกติกาให้มันที่นี่
#
# 18 ส.ค. 2569 โดเมนนั้นชี้ไปที่ Netlify project คนละตัว (gucut-admin)
# ซึ่ง build มาจาก repo github.com/10jetli/gucut-next (หลังร้านตัวเก่าที่ต่อ ZORT
# และดึงออเดอร์จาก Lazada / Shopee / TikTok) เจ้าของร้านใช้ทำงานจริงทุกวัน
#
# หลังร้านของ "เว็บหน้าร้าน" (โปรเจกต์นี้) อยู่ที่ gucut.com/admin/ ตามเดิม
# และถูกฝังเป็นกรอบไว้ในเมนู "เว็บไซต์ → ระบบหลังร้านเว็บ" ของหลังร้านตัวเก่า
# คนใช้จึงเห็นเป็นระบบเดียวกันโดยไม่ต้องย้ายโดเมน
#
# เมื่อก่อนตรงนี้เคยมีกติกาเปลี่ยนเส้นทาง admin.gucut.com → /admin/ เตรียมไว้
# ตัดออกแล้วเพราะไม่มีวันได้ใช้ และเสี่ยงเข้าใจผิดว่าโดเมนนี้เป็นของโปรเจกต์นี้
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# www.gucut.com → gucut.com (301) — ต้องอยู่ก่อนกติกา robots ข้างล่าง
#
# ทำไมต้องมี ไม่ใช่ปล่อยให้ทั้งสองชื่อเสิร์ฟเนื้อหาเหมือนกัน
#   1) ปุ่มเข้าสู่ระบบพัง — oauth.mjs สร้าง redirect_uri จากโดเมนที่ลูกค้าเข้ามา
#      เข้าทาง www = ส่ง https://www.gucut.com/api/oauth/.../callback ไปให้
#      LINE / Facebook / Google ซึ่งไม่ได้ลงทะเบียนไว้ → 400 Bad Request
#      (เจอของจริงเมื่อ 16 ส.ค. 2569 — ลงทะเบียนไว้เฉพาะชื่อไม่มี www)
#   2) เนื้อหาซ้ำในสายตา Google — สองชื่อ เนื้อหาชุดเดียวกันทุกหน้า
#
# แก้ที่ต้นเหตุ (รวมให้เหลือชื่อเดียว) ดีกว่าไปลงทะเบียน www เพิ่มที่สามเจ้า
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.gucut.com/*"
  to = "https://gucut.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# robots.txt — เสิร์ฟไฟล์จริงที่ public/robots.txt ตรง ๆ ไม่ต้องมีกติกาอะไร
#
# เมื่อก่อนต้องแยกเป็นสองไฟล์ตามโดเมน เพราะ new78.com เป็นเว็บซ้อมที่เนื้อหา
# เหมือน gucut.com ทุกหน้า ถ้าเปิดให้ Google เก็บทั้งคู่จะกลายเป็นเนื้อหาซ้ำ
# 18 ส.ค. 2569 ถอด new78.com ออกจาก Netlify แล้ว จึงเหลือไฟล์เดียวและไม่ต้องแยก
#
# ⚠️ ถ้าวันหน้าเอาโดเมนซ้อมกลับมาผูกกับโปรเจกต์นี้อีก ต้องกลับมาแยกไฟล์เหมือนเดิม
#    (ดูประวัติ git ของไฟล์นี้ — กติกาเดิมอยู่ในคอมมิตก่อนหน้า)
# ---------------------------------------------------------------------------

# Serverless function สต็อก/ราคาสดจาก ZORT (/api/stock)
[functions]
  directory = "netlify/functions"

# 🚫 **เขตที่ฟังก์ชันรัน ตั้งในไฟล์นี้ไม่ได้ — ลองมาแล้ว 6 ก.ย. 2569**
#    เคยใส่ `[functions.core]` + `region = "sin"` ตรงนี้ · **deploy ผ่านฉลุย ไม่มีคำเตือนสักคำ
#    แต่ไม่มีผลอะไรเลย** วัดหลัง deploy แล้วเวลาคุยฐานเท่าเดิมเป๊ะ (344 vs 332 มิลลิวินาที)
#    ⇒ ที่ที่ใช้ได้จริงคือ `export const config = { region: "sin" }` **ในตัวไฟล์ฟังก์ชันเอง**
#       (ดู netlify/functions/core.mjs ท้ายไฟล์)
# ⚠️ อย่าเอากลับมาใส่ตรงนี้อีก — ตั้งค่าที่ deploy ผ่านไม่ได้แปลว่าตั้งค่าติด

# แผนที่ SKU → รูปสินค้า ให้จอสินค้าฝั่ง admin.gucut.com ดึงข้ามโดเมน
[[headers]]
  for = "/sku-images.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
