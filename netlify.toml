# ให้ Netlify build เองจาก GitHub — push โค้ดขึ้น repo แล้วเว็บอัปเดตอัตโนมัติ
[build]
  command = "npm run build"      # prebuild (gen-reviews.mjs) รันเองอัตโนมัติ
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Image CDN — อนุญาตให้ย่อรูปจากโดเมนภายนอกเหล่านี้
# (รูปสินค้าจาก Shopify + รูปรีวิวจากแพลตฟอร์มต่าง ๆ)
[images]
  remote_images = [
    "https://cdn\\.shopify\\.com/.*",
    # รูปปกคลิปหลังย้ายไปเก็บที่ R2 ของเราเอง (ดู HOST ใน src/lib/videos.ts)
    # ช่วงแรกใช้ลิงก์ฟรีของ Cloudflare (pub-xxxx.r2.dev) ก่อน
    # วันที่ย้าย gucut.com มาอยู่ Cloudflare ค่อยเปลี่ยนไปใช้ video.gucut.com
    "https://pub-[a-z0-9]+\\.r2\\.dev/.*",
    "https://video\\.gucut\\.com/.*",
    "https://lzd-u\\.slatic\\.net/.*",
    "https://sg-test-11\\.slatic\\.net/.*",
    "https://cf\\.shopee\\.com/.*",
    "https://down-th\\.img\\.susercontent\\.com/.*",
    "https://p16-oec-sg\\.ibyteimg\\.com/.*",
    "https://p16-oec-va\\.ibyteimg\\.com/.*",
  ]

# ---------------------------------------------------------------------------
# ระบบหลังร้านอยู่ที่ admin.new78.com
#
# ใช้ build เดียวกับหน้าร้าน ไม่ได้แยกเว็บ — แค่บอก Netlify ว่าถ้าเข้ามาทาง
# โดเมนหลังร้าน ให้ไปหยิบหน้าใน /admin/ มาเสิร์ฟ
#
# 🚫 ตอนนี้ "ยังไม่เปิดใช้" และห้ามเปิดเองเด็ดขาด
#    โดเมน admin.new78.com ผูกอยู่กับ Netlify project คนละตัว (gucut-admin)
#    ซึ่งเจ้าของร้านใช้งานจริงอยู่ ย้ายมาที่ project นี้เมื่อไหร่ ของเดิมล่มทันที
#
#    กติกาข้างล่างจึงเงียบอยู่เฉย ๆ ไม่กระทบอะไรทั้งสิ้น เก็บไว้เผื่อวันหน้า
#    ถ้าจะใช้ชื่อโดเมนอื่นแทน (เช่น manage.new78.com) แก้แค่ชื่อในสองบรรทัด from
# ---------------------------------------------------------------------------

# หน้าแรกของโดเมนหลังร้าน = หน้าเข้าระบบหลังร้าน
# ต้องใส่ force เพราะปกติ / จะไปเจอหน้าแรกของหน้าร้านก่อน
[[redirects]]
  from = "https://admin.new78.com/"
  to = "/admin/"
  status = 200
  force = true

# เส้นทางอื่นบนโดเมนหลังร้าน — ไม่ใส่ force ตั้งใจ
# ไฟล์ที่มีอยู่จริง (/_next/, /img/, /api/, /admin/) จะถูกเสิร์ฟตามปกติก่อน
# ที่เหลือค่อยตกมาหาใน /admin/ เช่น admin.new78.com/chat/ → /admin/chat/
[[redirects]]
  from = "https://admin.new78.com/*"
  to = "/admin/:splat"
  status = 200

# Serverless function สต็อก/ราคาสดจาก ZORT (/api/stock)
[functions]
  directory = "netlify/functions"
