# ให้ Netlify build เองจาก GitHub — push โค้ดขึ้น repo แล้วเว็บอัปเดตอัตโนมัติ
[build]
  command = "npm run build"      # prebuild (gen-reviews.mjs) รันเองอัตโนมัติ
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Image CDN — อนุญาตให้ย่อรูปจากโดเมนภายนอกเหล่านี้
# (รูปสินค้าจาก Shopify + รูปรีวิวจากแพลตฟอร์มต่าง ๆ)
[images]
  remote_images = [
    "https://cdn\\.shopify\\.com/.*",
    # รูปปกคลิปหลังย้ายไปเก็บที่ R2 ของเราเอง (ดู HOST ใน src/lib/videos.ts)
    # ช่วงแรกใช้ลิงก์ฟรีของ Cloudflare (pub-xxxx.r2.dev) ก่อน
    # วันที่ย้าย gucut.com มาอยู่ Cloudflare ค่อยเปลี่ยนไปใช้ video.gucut.com
    "https://pub-[a-z0-9]+\\.r2\\.dev/.*",
    "https://video\\.gucut\\.com/.*",
    "https://lzd-u\\.slatic\\.net/.*",
    "https://sg-test-11\\.slatic\\.net/.*",
    "https://cf\\.shopee\\.com/.*",
    "https://down-th\\.img\\.susercontent\\.com/.*",
    "https://p16-oec-sg\\.ibyteimg\\.com/.*",
    "https://p16-oec-va\\.ibyteimg\\.com/.*",
  ]

# Serverless function สต็อก/ราคาสดจาก ZORT (/api/stock)
[functions]
  directory = "netlify/functions"
