# ให้ Netlify build เองจาก GitHub — push โค้ดขึ้น repo แล้วเว็บอัปเดตอัตโนมัติ
[build]
  command = "npm run build"      # prebuild (gen-reviews.mjs) รันเองอัตโนมัติ
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Image CDN — อนุญาตให้ย่อรูปจากโดเมนภายนอกเหล่านี้
# (รูปสินค้าจาก Shopify + รูปรีวิวจากแพลตฟอร์มต่าง ๆ)
[images]
  remote_images = [
    "https://cdn\\.shopify\\.com/.*",
    # รูปปกคลิปหลังย้ายไปเก็บที่ R2 ของเราเอง (ดู HOST ใน src/lib/videos.ts)
    # ช่วงแรกใช้ลิงก์ฟรีของ Cloudflare (pub-xxxx.r2.dev) ก่อน
    # วันที่ย้าย gucut.com มาอยู่ Cloudflare ค่อยเปลี่ยนไปใช้ video.gucut.com
    "https://pub-[a-z0-9]+\\.r2\\.dev/.*",
    "https://video\\.gucut\\.com/.*",
    "https://lzd-u\\.slatic\\.net/.*",
    "https://sg-test-11\\.slatic\\.net/.*",
    "https://cf\\.shopee\\.com/.*",
    "https://down-th\\.img\\.susercontent\\.com/.*",
    "https://p16-oec-sg\\.ibyteimg\\.com/.*",
    "https://p16-oec-va\\.ibyteimg\\.com/.*",
  ]

# ---------------------------------------------------------------------------
# 🚫 admin.gucut.com "ไม่ได้" ถูกเสิร์ฟจากโปรเจกต์นี้ — ห้ามเขียนกติกาให้มันที่นี่
#
# 18 ส.ค. 2569 โดเมนนั้นชี้ไปที่ Netlify project คนละตัว (gucut-admin)
# ซึ่ง build มาจาก repo github.com/10jetli/gucut-next (หลังร้านตัวเก่าที่ต่อ ZORT
# และดึงออเดอร์จาก Lazada / Shopee / TikTok) เจ้าของร้านใช้ทำงานจริงทุกวัน
#
# หลังร้านของ "เว็บหน้าร้าน" (โปรเจกต์นี้) อยู่ที่ gucut.com/admin/ ตามเดิม
# และถูกฝังเป็นกรอบไว้ในเมนู "เว็บไซต์ → ระบบหลังร้านเว็บ" ของหลังร้านตัวเก่า
# คนใช้จึงเห็นเป็นระบบเดียวกันโดยไม่ต้องย้ายโดเมน
#
# เมื่อก่อนตรงนี้เคยมีกติกาเปลี่ยนเส้นทาง admin.gucut.com → /admin/ เตรียมไว้
# ตัดออกแล้วเพราะไม่มีวันได้ใช้ และเสี่ยงเข้าใจผิดว่าโดเมนนี้เป็นของโปรเจกต์นี้
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# www.gucut.com → gucut.com (301) — ต้องอยู่ก่อนกติกา robots ข้างล่าง
#
# ทำไมต้องมี ไม่ใช่ปล่อยให้ทั้งสองชื่อเสิร์ฟเนื้อหาเหมือนกัน
#   1) ปุ่มเข้าสู่ระบบพัง — oauth.mjs สร้าง redirect_uri จากโดเมนที่ลูกค้าเข้ามา
#      เข้าทาง www = ส่ง https://www.gucut.com/api/oauth/.../callback ไปให้
#      LINE / Facebook / Google ซึ่งไม่ได้ลงทะเบียนไว้ → 400 Bad Request
#      (เจอของจริงเมื่อ 16 ส.ค. 2569 — ลงทะเบียนไว้เฉพาะชื่อไม่มี www)
#   2) เนื้อหาซ้ำในสายตา Google — สองชื่อ เนื้อหาชุดเดียวกันทุกหน้า
#
# แก้ที่ต้นเหตุ (รวมให้เหลือชื่อเดียว) ดีกว่าไปลงทะเบียน www เพิ่มที่สามเจ้า
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.gucut.com/*"
  to = "https://gucut.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# robots.txt — เสิร์ฟไฟล์จริงที่ public/robots.txt ตรง ๆ ไม่ต้องมีกติกาอะไร
#
# เมื่อก่อนต้องแยกเป็นสองไฟล์ตามโดเมน เพราะ new78.com เป็นเว็บซ้อมที่เนื้อหา
# เหมือน gucut.com ทุกหน้า ถ้าเปิดให้ Google เก็บทั้งคู่จะกลายเป็นเนื้อหาซ้ำ
# 18 ส.ค. 2569 ถอด new78.com ออกจาก Netlify แล้ว จึงเหลือไฟล์เดียวและไม่ต้องแยก
#
# ⚠️ ถ้าวันหน้าเอาโดเมนซ้อมกลับมาผูกกับโปรเจกต์นี้อีก ต้องกลับมาแยกไฟล์เหมือนเดิม
#    (ดูประวัติ git ของไฟล์นี้ — กติกาเดิมอยู่ในคอมมิตก่อนหน้า)
# ---------------------------------------------------------------------------

# Serverless function สต็อก/ราคาสดจาก ZORT (/api/stock)
[functions]
  directory = "netlify/functions"
